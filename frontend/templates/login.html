{% extends "base.html" %}
{% block title %}Log in · SmartStickies{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>Log in</h1>
  <p class="subtitle">Tap back in to see your badge collection.</p>

  <form method="post" action="{{ url_for('login') }}" class="form">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" value="{{ email or '' }}" required autofocus>

    <label for="password">Password</label>
    <input type="password" id="password" name="password" required>

    <button type="submit" class="btn btn-primary">Log in</button>
  </form>

  <p class="switch-link">No account yet? <a href="{{ url_for('signup') }}">Sign up</a></p>
</div>
{% endblock %}
