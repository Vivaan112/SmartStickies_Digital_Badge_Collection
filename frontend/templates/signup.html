{% extends "base.html" %}
{% block title %}Sign up · SmartStickies{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>Create your account</h1>
  <p class="subtitle">Sign up to start collecting badges from every tap.</p>

  <form method="post" action="{{ url_for('signup') }}" class="form">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" value="{{ email or '' }}" required autofocus>

    <label for="password">Password</label>
    <input type="password" id="password" name="password" required>

    <button type="submit" class="btn btn-primary">Sign up</button>
  </form>

  <p class="switch-link">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
</div>
{% endblock %}
